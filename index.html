<!doctype html>

  <meta name="theme-color" content="#14213d">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>

  <a class="skip" href="#view">Skip to content</a>

  <aside class="sidebar" id="sidebar" aria-label="SuperBook">
    <a class="brand" href="#home" aria-label="SuperBook home">
      <img src="logo.svg" alt="" width="96" height="78">
      <span class="brand-name">SuperBook</span>
      <span class="brand-tag" data-i18n="brandTag">Three Scriptures. Shared History. Deeper Understanding.</span>
    </a>
    <nav class="side-nav" id="sideNav" aria-label="Main"></nav>
    <a class="daily" id="daily" href="#home"></a>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <div class="shell">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false" aria-controls="sidebar"><svg><use href="#i-menu"/></svg></button>
      <h1 class="page-title" id="pageTitle">SuperBook</h1>
      <form class="search" id="searchForm" role="search">
        <svg aria-hidden="true"><use href="#i-search"/></svg>
        <input id="search" type="search" autocomplete="off" placeholder="Search scriptures, topics, people, or keywords…" aria-label="Search or ask a question" data-i18n-placeholder="searchPlaceholder" data-i18n-aria-label="searchLabel">
      </form>
      <div class="lang-menu">
        <button class="lang-btn" id="langBtn" aria-haspopup="listbox" aria-expanded="false"><svg aria-hidden="true"><use href="#i-globe"/></svg><span id="langName">English (EN)</span></button>
        <ul class="lang-list" id="langList" role="listbox" hidden></ul>
      </div>
      <a class="icon-btn" href="#plans" aria-label="Reading plans" data-i18n-aria-label="nav.plans"><svg><use href="#i-bell"/></svg></a>
      <a class="icon-btn" href="#favorites" aria-label="Favorites and notes" data-i18n-aria-label="nav.favorites"><svg><use href="#i-user"/></svg></a>
    </header>

    <main id="view" tabindex="-1"></main>

    <footer class="foot">
      <p data-i18n="footNote">Texts are public-domain translations loaded from Sefaria, bible-api.com, getbible.net and alquran.cloud. Overviews are simplified; beliefs and practices vary within each tradition.</p>
    </footer>
  </div>

  <nav class="bottom-nav" id="bottomNav" aria-label="Main"></nav>

  <script type="module" src="src/app.js"></script>

</html>
